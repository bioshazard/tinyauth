name: Biosnet image
on:
  push:
    branches: [feat/household-identities]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: biosnet-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Test and vet backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: fork-validation
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=biosnet
          cache-to: type=gha,scope=biosnet,mode=max
      - name: Household identity integration
        run: tests/household/check.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=biosnet
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=biosnet
          cache-to: type=gha,scope=biosnet,mode=max
